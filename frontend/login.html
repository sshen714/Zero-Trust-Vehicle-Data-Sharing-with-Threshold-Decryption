<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入｜零信任車輛資料分享</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>零信任車輛資料分享</h1>
        <h2>登入</h2>
        <p>請輸入帳號與密碼。</p>

        <!-- JavaScript 載入後才啟用提交，避免未攔截的表單送出。 -->
        <form id="login-form" method="post">
            <p>
                <label for="username">帳號</label>
                <input id="username" name="username" type="text"
                       autocomplete="username" maxlength="50" required>
            </p>
            <p>
                <label for="password">密碼</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </p>
            <button type="button" disabled>登入（等待 JavaScript 載入）</button>
        </form>

        <p id="message" role="status" aria-live="polite">
            正在載入登入功能，請確認瀏覽器已啟用 JavaScript。
        </p>
    </main>
</body>
</html>
