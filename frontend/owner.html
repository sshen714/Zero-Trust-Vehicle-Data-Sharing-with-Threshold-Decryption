<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車主工作區｜零信任車輛資料分享</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-role="owner">
    <main class="dashboard">
        <h1>零信任車輛資料分享</h1>
        <section id="profile" hidden aria-label="目前使用者">
            <p class="account-row"><span>帳號</span><strong id="current-username"></strong></p>
            <p class="account-row"><span>角色</span><strong id="current-role"></strong></p>
            <button id="logout" type="button">登出</button>
        </section>
        <section id="workspace" hidden aria-label="車主工作區">
            <h2>車主工作區</h2>
            <p>查詢自己的車牌資料</p>
            <p class="preview-notice">下載內容只包含精確時間，以及模糊化的位置或速度。</p>
            <ul class="access-list"><li>只能查詢本人綁定的車牌</li><li>時間可留白，代表查詢全部模擬期間</li></ul>
            
            <div class="role-grid">
<section class="feature-card">
<h3>我的車牌資料</h3>
<p>輸入本人綁定的車牌，選擇要下載的位置或速度資料。</p>
<label for="owner-plate">車牌</label>
<input id="owner-plate" type="text" maxlength="32" autocomplete="off" placeholder="例如 V00000" required>
<p id="owner-available-range">正在載入可查詢時間…</p>
<label for="owner-start">開始時間（選填）</label>
<input id="owner-start" type="datetime-local" step="1">
<label for="owner-end">結束時間（選填）</label>
<input id="owner-end" type="datetime-local" step="1">
<div class="preview-actions">
<button type="button" data-owner-export="location">下載模糊位置 CSV</button>
<button type="button" data-owner-export="speed">下載模糊速度 CSV</button>
</div>
</section>
            </div>
        </section>
        <p id="message" role="status" aria-live="polite">正在驗證登入身份…</p>
        <noscript>請啟用 JavaScript 以驗證登入身份。</noscript>
    </main>
</body>
</html>
