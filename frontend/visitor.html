<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪客工作區｜零信任車輛資料分享</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-role="visitor">
    <main class="dashboard">
        <h1>零信任車輛資料分享</h1>
        <section id="profile" hidden aria-label="目前使用者">
            <p class="account-row"><span>帳號</span><strong id="current-username"></strong></p>
            <p class="account-row"><span>角色</span><strong id="current-role"></strong></p>
            <button id="logout" type="button">登出</button>
        </section>
        <section id="workspace" hidden aria-label="訪客工作區">
            <h2>訪客工作區</h2>
            <p>查看交通概況</p>
            <p class="preview-notice">介面展示：以下內容與操作尚未連接資料查詢、申請、審核或 OTP 服務。</p>
            <ul class="access-list"><li>只提供彙總交通統計</li><li>時間區間化</li><li>不提供個別車輛位置或速度</li></ul>
            <div class="metric-grid"><div class="metric-card"><span>車流量</span><strong>—</strong><small>尚未載入資料</small></div>
<div class="metric-card"><span>平均速度</span><strong>—</strong><small>尚未載入資料</small></div>
<div class="metric-card"><span>壅塞程度</span><strong>—</strong><small>尚未載入資料</small></div></div>
            <div class="role-grid">
<section class="feature-card">
<h3>交通概況</h3>
<p>依時間區間查看車流量、平均速度及壅塞程度。</p>
<label for="visitor-0-0">開始時間</label>
<input id="visitor-0-0" type="datetime-local">
<label for="visitor-0-1">結束時間</label>
<input id="visitor-0-1" type="datetime-local">
<div class="preview-actions"><button type="button" data-preview>查看交通概況</button></div>

</section>
            </div>
        </section>
        <p id="message" role="status" aria-live="polite">正在驗證登入身份…</p>
        <noscript>請啟用 JavaScript 以驗證登入身份。</noscript>
    </main>
</body>
</html>
