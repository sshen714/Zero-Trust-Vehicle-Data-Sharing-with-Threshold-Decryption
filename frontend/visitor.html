<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪客工作區｜零信任車輛資料分享</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-public-page="visitor">
    <main class="dashboard">
        <h1>零信任車輛資料分享</h1>
        <p><a href="login.html">返回登入頁</a></p>
        <section id="public-visitor" aria-label="公開訪客交通統計">
            <h2>訪客</h2>
            <p>不需登入，只提供所選時間內的整體平均速度。</p>
            <p class="preview-notice">不提供車牌、車輛數、個別速度、位置、軌跡或資料下載。</p>
            <div class="role-grid">
<section class="feature-card">
<h3>查詢時間</h3>
<p id="visitor-available-range">正在載入可查詢時間…</p>
<label for="visitor-start">開始時間</label>
<input id="visitor-start" type="datetime-local" step="1">
<label for="visitor-end">結束時間</label>
<input id="visitor-end" type="datetime-local" step="1">
<div class="preview-actions"><button id="visitor-query" type="button">查詢平均速度</button></div>
</section>
            </div>
            <div class="metric-grid single-metric">
                <div class="metric-card">
                    <span>平均速度</span>
                    <strong id="visitor-average-speed">—</strong>
                    <small id="visitor-average-note">選擇時間後查詢</small>
                </div>
            </div>
        </section>
        <p id="message" role="status" aria-live="polite">正在載入公開交通統計…</p>
        <noscript>請啟用 JavaScript 以查詢平均速度。</noscript>
    </main>
</body>
</html>
